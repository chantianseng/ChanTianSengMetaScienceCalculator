<script>
document.body.addEventListener('pointerdown',function(){

  if(bgm&&bgm.paused){
    bgm.play().catch(error=>{
      console.log("播放被浏览器拦截:",error);

/* =========================================================
   基础数据
========================================================= */
const stems=[
  "甲","乙","丙","丁","戊",
  "己","庚","辛","壬","癸"
];
const branches=[
  "子","丑","寅","卯","辰","巳",
  "午","未","申","酉","戌","亥"
];
const wux={
  甲:"木",乙:"木",
  丙:"火",丁:"火",
  戊:"土",己:"土",
  庚:"金",辛:"金",
  壬:"水",癸:"水",
  子:"水",丑:"土",
  寅:"木",卯:"木",
  辰:"土",巳:"火",
  午:"火",未:"土",
  申:"金",酉:"金",
  戌:"土",亥:"水"
};
const ten=[
  "比肩","劫财","食神","伤官","偏财",
  "正财","七杀","正官","偏印","正印"
];
const animals=[
  "鼠","牛","虎","兔","龙","蛇",
  "马","羊","猴","鸡","狗","猪"
];
let state=null;
/* =========================================================
   基础八字
========================================================= */
function dtParts(){
  const d=document.getElementById("date").value;
  const t=document.getElementById("time").value||"12:00";
  return [d,t];
}
function dayIndex(y,m,d){
  let a=Math.floor((14-m)/12);
  let yy=y+4800-a;
  let mm=m+12*a-3;
  return d+
    Math.floor((153*mm+2)/5)+
    365*yy+
    Math.floor(yy/4)-
    Math.floor(yy/100)+
    Math.floor(yy/400)-
    32045;
}
/*
 * 原代码 solarMonth() 只是：
 *
 * 5,4,5,5,5,6...
 *
 * 用固定日期判断节气。
 *
 * 这不是严格的节气计算。
 *
 * 这里暂时保留原结构，以避免改变整个八字模块。
 * 紫微模块本身使用农历日期，不再依赖这个近似函数。
 */
function solarMonth(y,m,d){
  const bounds=[
    5,4,5,5,5,6,
    7,7,7,8,7,7
  ];
  let idx=m-1;
  if(d<bounds[idx]){
    idx=(idx+11)%12;
  }
  return idx;
}
function bazi(y,m,d,h,mi){
  let sy=y;
  if(m<2||(m===2&&d<4)){
    sy--;
  }
  let yi=((sy-4)%60+60)%60;
  let ystem=yi%10;
  let ybranch=yi%12;
  let sm=solarMonth(y,m,d);
  let mb=(sm+1)%12;
  let mstem=((ystem%5)*2+mb)%10;
  let jd=dayIndex(y,m,d);
  let di=((jd+49)%60+60)%60;
  let dstem=di%10;
  let dbranch=di%12;
  let hb=Math.floor((h+1)/2)%12;
  let hstem=(dstem%5*2+hb)%10;
  return {
    yi,
    year:[stems[ystem],branches[ybranch]],
    month:[stems[mstem],branches[mb]],
    day:[stems[dstem],branches[dbranch]],
    hour:[stems[hstem],branches[hb]],
    dstem,
    dbranch
  };
}
function countWu(p){
  let c={
    木:0,
    火:0,
    土:0,
    金:0,
    水:0
  };
  p.forEach(x=>{
    c[wux[x[0]]]++;
    c[wux[x[1]]]++;
  });
  return c;
}
function dayMasterInfo(dm){
  return wux[dm]+" · "+dm+"日主";
}
/* =========================================================
   正确农历取得
========================================================= */
/*
 * 原代码：
 *
 * function lunarApprox(...)
 *
 * 是用：
 *
 * 354 天
 * 29.5 天
 *
 * 去“估算”农历。
 *
 * 紫微斗数不能这样做，因为：
 *
 * 1. 农历月份不是固定 29.5 天简单循环
 * 2. 有大小月
 * 3. 有闰月
 * 4. 农历日期直接参与紫微星定位
 *
 * 这里改用浏览器 Intl Chinese Calendar。
 *
 * 返回：
 * {
 *   year: 农历年份,
 *   month: 农历月份,
 *   day: 农历日,
 *   leap: 是否闰月
 * }
 */
const lunarMonthNames={
  "正月":1,
  "一月":1,
  "二月":2,
  "三月":3,
  "四月":4,
  "五月":5,
  "六月":6,
  "七月":7,
  "八月":8,
  "九月":9,
  "十月":10,
  "十一月":11,
  "十二月":12
};
const chineseNumMap={
  "〇":0,
  "零":0,
  "一":1,
  "二":2,
  "三":3,
  "四":4,
  "五":5,
  "六":6,
  "七":7,
  "八":8,
  "九":9
};
function chineseDayToNumber(str){
  if(!str) return null;
  const map={
    "初一":1,
    "初二":2,
    "初三":3,
    "初四":4,
    "初五":5,
    "初六":6,
    "初七":7,
    "初八":8,
    "初九":9,
    "初十":10,
    "十一":11,
    "十二":12,
    "十三":13,
    "十四":14,
    "十五":15,
    "十六":16,
    "十七":17,
    "十八":18,
    "十九":19,
    "二十":20,
    "廿一":21,
    "廿二":22,
    "廿三":23,
    "廿四":24,
    "廿五":25,
    "廿六":26,
    "廿七":27,
    "廿八":28,
    "廿九":29,
    "三十":30
  };
  if(map[str]!=null){
    return map[str];
  }
  /*
   * 兼容部分浏览器返回：
   *
   * 一
   * 十
   * 二十
   * 三十
   */
  if(/^\d+$/.test(str)){
    return Number(str);
  }
  if(str==="十") return 10;
  if(str.length===2&&str[0]==="十"){
    return 10+chineseNumMap[str[1]];
  }
  if(str.length===2&&str[1]==="十"){
    return chineseNumMap[str[0]]*10;
  }
  if(str.length===3&&str[1]==="十"){
    return chineseNumMap[str[0]]*10+chineseNumMap[str[2]];
  }
  return null;
}
function getLunarDate(y,m,d){
  /*
   * 中午构造日期，避免部分浏览器因夏令时/时区
   * 在午夜边界发生日期偏移。
   *
   * 紫微这里首先需要公历“日”的农历日期。
   */
  const date=new Date(y,m-1,d,12,0,0);
  const formatter=new Intl.DateTimeFormat(
    "zh-CN-u-ca-chinese",
    {
      year:"numeric",
      month:"long",
      day:"numeric"
    }
  );
  const parts=formatter.formatToParts(date);
  let monthText="";
  let dayText="";
  let yearText="";
  parts.forEach(p=>{
    if(p.type==="month") monthText=p.value;
    if(p.type==="day") dayText=p.value;
    if(p.type==="relatedYear") yearText=p.value;
    if(p.type==="year"&&!yearText) yearText=p.value;
  });
  /*
   * 有些 Chromium 版本可能返回：
   *
   * “九月”
   * “初九”
   *
   * 有些版本会返回：
   *
   * “九月”
   * “9”
   *
   * 因此两种都兼容。
   */
  let month=0;
  if(lunarMonthNames[monthText]){
    month=lunarMonthNames[monthText];
  }else{
    const match=monthText.match(
      /(正|一|二|三|四|五|六|七|八|九|十|十一|十二)月/
    );
    if(match){
      month=lunarMonthNames[match[0]]||0;
    }
  }
  let day=chineseDayToNumber(dayText);
  /*
   * 如果浏览器返回数字月份/日期，继续兼容。
   */
  if(!month&&/^\d+$/.test(monthText)){
    month=Number(monthText);
  }
  if(!day&&/^\d+$/.test(dayText)){
    day=Number(dayText);
  }
  /*
   * 判断闰月。
   */
  const full=formatter.format(date);
  const leap=/闰/.test(full)||/bis/.test(full.toLowerCase());
  if(!month||!day){
    console.warn(
      "无法从浏览器 Intl Chinese Calendar 解析农历日期：",
      full,
      parts
    );
    throw new Error(
      "当前浏览器无法可靠取得农历日期，请使用最新版 Chrome / Safari / Edge。"
    );
  }
  return {
    year:Number(yearText)||y,
    month,
    day,
    leap,
    text:full
  };
}
/*
 * 保留原接口名称。
 *
 * 这样不会破坏你其他代码。
 */
function lunarApprox(y,m,d){
  const l=getLunarDate(y,m,d);
  return {
    m:l.month,
    d:l.day,

/*
 * ---------------------------------------------------------
 * 第一步：命宫
 * ---------------------------------------------------------
 *
 * 正月起寅。
 *
 * 从寅顺数至出生农历月份。
 *
 * 再从该月宫起子时，逆数至出生时辰。
 *
 * 公式：
 *
 * monthPalace = 寅 + (农历月 - 1)
 * life = monthPalace - 时辰
 *
 * ---------------------------------------------------------
 */
function calcLifeBodyPalace(lunarMonth,hourBranch){
  const monthPalace=
    (2+lunarMonth-1)%12;
  const life=
    (monthPalace-hourBranch+12)%12;
  /*
   * 身宫：
   *
   * 从寅起正月，
   * 顺数至出生月份，
   * 再从该宫顺数出生时辰。
   */
  const body=
    (monthPalace+hourBranch)%12;
  return {
    monthPalace,
    life,
    body
  };
}

/*
 * ---------------------------------------------------------
 * 第四步：安紫微
 * ---------------------------------------------------------
 *
 * 传统口诀：
 *
 * 六五四三二
 * 酉午亥辰丑
 *
 * 即：
 *
 * 火六局 → 酉
 * 土五局 → 午
 * 金四局 → 亥
 * 木三局 → 辰
 * 水二局 → 丑
 *
 * 再根据农历生日和局数安紫微。
 *
 * 为了避免“余数算法”在整除、生日小于局数时出错，
 * 这里直接采用公式化版本：
 *
 * Q = ceil(D / M)
 * R = Q*M - D
 *
 * 以寅宫为基准：
 *
 * pos = 寅 + (Q-1)
 *
 * R 为偶数 → 顺数 R
 * R 为奇数 → 逆数 R
 *
 * ---------------------------------------------------------
 */
function mod12(n){
  return ((n%12)+12)%12;
}
function calcZiweiPosition(lunarDay,bureauNumber){
  const D=lunarDay;
  const M=bureauNumber;
  const Q=Math.ceil(D/M);
  const R=Q*M-D;
  let pos=
    2+(Q-1);
  if(R%2===0){
    pos+=R;
  }else{
    pos-=R;
  }
  return mod12(pos);
}
/*
 * ---------------------------------------------------------
 * 第五步：天府
 * ---------------------------------------------------------
 *
 * 紫微与天府不是随机独立计算。
 *
 * 天府由紫微位置镜像确定。
 *
 * 常用十二宫编号下：
 *
 * Tianfu = 4 - Ziwei
 *
 * ---------------------------------------------------------
 */
function calcTianfuPosition(ziweiPos){
  return mod12(4-ziweiPos);
}
/*
 * ---------------------------------------------------------
 * 第六步：十四主星
 * ---------------------------------------------------------
 *
 * 紫微系：

 *
 * 天府系：
 *
 * 天府
 * 太阴
 * 贪狼
 * 巨门
 * 天相
 * 天梁
 * 七杀
 * 破军
 *
 * ---------------------------------------------------------
 */
function addStar(palaceStars,pos,name){
  if(!palaceStars[pos]){
    palaceStars[pos]=[];
  }
  palaceStars[pos].push(name);
}
function placeMajorStars(ziweiPos){
  const palaceStars=
    Array.from({length:12},()=>[]);
  const tianfuPos=
    calcTianfuPosition(ziweiPos);
  /*
   * 紫微系逆行。
   */
  addStar(palaceStars,ziweiPos,"紫微");
  addStar(
    palaceStars,
    mod12(ziweiPos-1),
    "天机"
  );
  addStar(
    palaceStars,
    mod12(ziweiPos-3),
    "太阳"
  );
  addStar(

  );
  addStar(

  );
  addStar(
    palaceStars,
    mod12(ziweiPos-8),

  );
  /*
   * 天府系顺行。
   */
  addStar(
    palaceStars,
    tianfuPos,
    "天府"
  );
  addStar(
    palaceStars,
    mod12(tianfuPos+1),
    "太阴"
  );
  addStar(

   * 其传统定位为天府系的特定对应宫位。
   */

  );
  return {

/*
 * ---------------------------------------------------------
 * 紫微主函数
 * ---------------------------------------------------------
 *
 * 这是本次最重要的替换。
 *
 * 删除原来的：
 *
 * if (y === 1990 && m === 10 && d === 26) {
 *    ...
 * }
 *
 * 以后任何日期都走统一算法。
 * ---------------------------------------------------------
 */
function ziwei(y,m,d,h){
  /*
   * 1. 获取真实农历
   */
  const l=lunarApprox(y,m,d);
  /*
   * 2. 出生时辰
   */
  const hourBranch=
    Math.floor((h+1)/2)%12;
  /*
   * 3. 命宫、身宫
   */
  const mb=
    calcLifeBodyPalace(
      l.m,
      hourBranch
    );
  /*
   * 4. 生年干
   *
   * 使用八字年柱。
   */
  const bp=bazi(y,m,d,h,0);
  const yearStem=
    bp.year[0];
  /*
   * 5. 命宫所在干支
   *
   * 命宫地支已经确定。
   *
   * 现在需要把命宫天干推出来。
   *
   * 五虎遁：
   *
   * 甲己年丙寅起
   * 乙庚年戊寅起
   * 丙辛年庚寅起
   * 丁壬年壬寅起
   * 戊癸年甲寅起
   */
  const monthStemStart={
    "甲":2,
    "己":2,
    "乙":4,
    "庚":4,
    "丙":6,
    "辛":6,
    "丁":8,
    "壬":8,
    "戊":0,
    "癸":0
  }[yearStem];
  const lifeStem=
    stems[
      mod12(
        monthStemStart+
        (mb.life-2)
      )%10
    ];
  /*
   * 上面必须使用“天干十位”而不是直接使用
   * 十二宫编号。
   *
   * 重新规范计算。
   */
  const lifeStemIndex=
    mod12(monthStemStart+(mb.life-2))%10;
  const lifeStemFinal=
    stems[lifeStemIndex];
  /*
   * 6. 五行局
   */
  const bureau=
    getBureau(
      yearStem,
      branches[mb.life]
    );
  /*
   * 7. 紫微
   */
  const ziweiPos=
    calcZiweiPosition(
      l.d,
      bureau.number
    );
  /*
   * 8. 十四主星
   */
  const starResult=
    placeMajorStars(ziweiPos);
  /*
   * 9. 十二宫
   */
  const cells=[];
  for(let i=0;i<12;i++){
    const palaceIndex=
      mod12(i-mb.life);
    const palace=
      palaceNames[palaceIndex];
    const stars=
      starResult.palaceStars[i].length
      ? starResult.palaceStars[i]
      : ["无主星"];
    cells.push({
      index:i,
      branch:branches[i],
      palace,
      stars,
      isLife:i===mb.life,
      isBody:i===mb.body
    });
  }
  return {
    lunar:l,
    /*
     * 兼容原 render() 中 z.l.m / z.l.d
     */
    l:{
      m:l.m,
      d:l.d,
      year:l.year,
      leap:l.leap
    },
    life:mb.life,
    body:mb.body,
    monthPalace:mb.monthPalace,
    yearStem,
    lifeStem:lifeStemFinal,
    lifeGanzhi:
      lifeStemFinal+
      branches[mb.life],
    bureauNumber:bureau.number,
    bureauName:bureau.name,
    ziweiPos,
    ziweiBranch:
      branches[ziweiPos],
    tianfuPos:
      starResult.tianfuPos,
    tianfuBranch:
      branches[starResult.tianfuPos],
    palaceStars:
      starResult.palaceStars,
    cells
  };
}

function numToChinese(num){
  const digits=[
    "零","一","二","三","四",
    "五","六","七","八","九"
  ];
  return String(num)
    .split("")
    .map(d=>digits[parseInt(d)])
    .join("");
}
function arkRoot(n){
  if(n===0)return 0;
  let sum=n;
  while(sum>=10){
    sum=sum
      .toString()
      .split("")
      .reduce(
        (acc,val)=>
          acc+parseInt(val),
        0
      );
  }
  return sum;
}
function getLifeNumber(y,m,d){
  let str=
    `${y}${String(m).padStart(2,'0')}${String(d).padStart(2,'0')}`;
  let sum=
    str
      .split("")
      .reduce(
        (acc,val)=>
          acc+parseInt(val),
        0
      );
  return arkRoot(sum);
}
/* =========================================================
   生命密码
========================================================= */
function calcHarmonyArk(y,m,d){
  let ys=y.toString().padStart(4,"0");
  let ms=m.toString().padStart(2,"0");
  let ds=d.toString().padStart(2,"0");
  let Y1=parseInt(ys.substring(0,2));
  let Y2=parseInt(ys.substring(2,4));
  let M=parseInt(ms);
  let D=parseInt(ds);
  let B1=arkRoot(D);
  let B2=arkRoot(M);
  let B3=arkRoot(Y1);
  let B4=arkRoot(Y2);
  let M1=arkRoot(B1+B2);
  let M2=arkRoot(B3+B4);
  let G=arkRoot(M1+M2);
  let L1=arkRoot(M1+B1);
  let L2=arkRoot(M1+B2);
  let L3=arkRoot(L1+L2);
  let R1=arkRoot(M2+B3);
  let R2=arkRoot(M2+B4);
  let R3=arkRoot(R1+R2);
  let T1=arkRoot(G+M1);
  let T2=arkRoot(G+M2);
  let T3=arkRoot(T1+T2);
  let inner=arkRoot(M1+M2+G);
  let outer=arkRoot(L3+R3+T3);
  let sub=arkRoot(B1+B4+M1+M2);
  let late=`${R1}${R2}${R3}`;
  let joint=[
    [
      `${B1}${B2}${M1}`,
      `${B3}${B4}${M2}`,
      `${M1}${M2}${G}`,
      `${B2}${M1}${L2}`
    ],
    [
      `${B1}${M1}${L1}`,
      `${L1}${L2}${L3}`,
      `${M2}${G}${T2}`,
      `${M1}${G}${T1}`
    ],
    [
      `${T2}${T1}${T3}`,
      `${B3}${M2}${R1}`,
      `${B4}${M2}${R2}`,
      `${R1}${R2}${R3}`
    ]
  ];
  return {
    B1,B2,B3,B4,
    M1,M2,G,
    L1,L2,L3,
    R1,R2,R3,
    T1,T2,T3,
    inner,outer,sub,
    late,
    joint,
    ds,ms,
    y1:ys.substring(0,2),
    y2:ys.substring(2,4)
  };
}

  return `${dm}日主可从「${t[wux[dm]]}」切入。
  五行显性计数以${strong}较突出，传统命理通常还需结合月令、藏干、刑冲合害及大运流年综合判断，不能只凭一个数量下结论。`;

function ask(){
  let q=document.getElementById("q");
  let txt=q.value.trim();
  if(!txt||!state)return;
  let box=document.getElementById("messages");
  box.innerHTML+=`
    <div class="msg me">
      ${esc(txt)}
    </div>
  `;
  let a=answer(txt);
  box.innerHTML+=`
    <div class="msg ai">
      ${a}
    </div>
  `;
  box.scrollTop=box.scrollHeight;
  q.value="";
}
function answer(q){
  let p=state.p;
  let c=state.counts;
  let dm=p.day[0];
  let z=state.z;
  if(/命宫/.test(q)){
    return `

「${branches[z.life]}」。
命宫干支为
「${z.lifeGanzhi}」。
五行局为
「${z.bureauName}」。
紫微星在
「${z.ziweiBranch}」。
天府星在
「${z.tianfuBranch}」。
    `.trim();
  }
  if(/紫微|天府|主星/.test(q)){
    return `
你的十四主星已经按照统一安星算法排入十二宫。
紫微：
${z.ziweiBranch}

${z.tianfuBranch}

${branches[z.body]}
可以进一步按照命宫、夫妻宫、官禄宫、财帛宫分别解释。
    `.trim();

目前显性五行以${Object.keys(c).sort((a,b)=>c[b]-c[a])[0]}较突出。
职业判断不能只看一个五行，建议再结合官杀、财星、食伤以及大运。
紫微方面则可以进一步观察命宫、官禄宫、财帛宫。`;
  }
  if(/财|钱|收入/.test(q)){
    return `财务主题建议重点观察财星、日主承载力与大运流年，而不是简单地把“某五行多”当成有财或没财。
你的日主是${dm}，紫微则可以进一步观察财帛宫、命宫与官禄宫之间的结构。`;
  }
  if(/感情|恋爱|婚姻|对象/.test(q)){
    return `关系分析在八字里要结合夫妻宫、财官星、合冲刑害和运势阶段；
紫微则会重点看夫妻宫以及命宫、福德宫等相关宫位。
你当前盘面已经生成，可以继续问“我的夫妻宫在哪里？”`;

紫微方面目前已经完成命宫、身宫、五行局、紫微、天府以及十四主星定位。
你可以直接问事业、财运、感情、命宫、夫妻宫或官禄宫。`;

function esc(s){
  return s.replace(
    /[&<>"]/g,
    x=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;"
    }[x])
  );
}

function tab(id,el){
  document
    .querySelectorAll(".view")
    .forEach(x=>x.classList.add("hidden"));
  document
    .getElementById(id)
    .classList
    .remove("hidden");
  document
    .querySelectorAll(".tab")
    .forEach(x=>x.classList.remove("active"));
  if(el){
    el.classList.add("active");
  }
}
