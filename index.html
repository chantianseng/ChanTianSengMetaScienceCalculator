<html lang="zh-CN">

<style>
:root{--bg:#090d13;--panel:#111722;--panel2:#171e2b;--line:#273244;--text:#edf2f7;--muted:#93a0b3;--gold:#d8b36a;--gold2:#f0d18d;--red:#c96b62;--green:#72b08a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif}
body{padding-bottom:env(safe-area-inset-bottom)}
.app{max-width:760px;margin:auto;min-height:100vh;padding:calc(12px + env(safe-area-inset-top)) 16px 28px}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 2px 16px}
.brand{font-weight:800;letter-spacing:.08em;font-size:20px}.brand span{color:var(--gold)}
.badge{font-size:11px;color:var(--gold);border:1px solid #6b5834;border-radius:99px;padding:5px 9px}
.hero{background:linear-gradient(145deg,#151b26,#0f141d);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 16px 45px #0005}
h1{font-size:28px;margin:0 0 7px;letter-spacing:.02em}.sub{color:var(--muted);font-size:13px;line-height:1.7}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:16px}.field{background:#0c121b;border:1px solid var(--line);border-radius:14px;padding:10px}.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}input,select{width:100%;background:transparent;border:0;color:var(--text);font-size:15px;outline:0}input[type=date],input[type=time]{color-scheme:dark}
.actions{display:flex;gap:10px;margin-top:14px}button{border:0;border-radius:14px;padding:13px 16px;font-size:14px;font-weight:700;cursor:pointer}.primary{background:var(--gold);color:#15110a;flex:1}.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.tabs{display:flex;gap:8px;overflow:auto;margin:16px 0 10px}.tab{white-space:nowrap;padding:9px 13px;border-radius:99px;background:var(--panel);border:1px solid var(--line);color:var(--muted)}.tab.active{color:#1b1408;background:var(--gold);border-color:var(--gold)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0}.title{font-weight:800;margin-bottom:12px}.muted{color:var(--muted);font-size:12px}.pill{display:inline-block;padding:4px 7px;border:1px solid var(--line);border-radius:7px;margin:2px;font-size:12px}
.bazi{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.pillar{background:var(--panel2);border-radius:13px;padding:10px 5px;text-align:center}.pillar small{display:block;color:var(--muted);font-size:10px;margin-bottom:5px}.pillar b{display:block;font-size:23px;line-height:1.1}.pillar em{display:block;font-style:normal;font-size:10px;color:var(--gold);margin-top:5px}
.five{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.five div{background:var(--panel2);border-radius:12px;padding:10px 3px;text-align:center}.five b{display:block;font-size:17px}.five span{font-size:10px;color:var(--muted)}
.palace{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.palace div{min-height:76px;background:var(--panel2);border:1px solid #222c3b;border-radius:10px;padding:7px;font-size:11px}.palace strong{display:block;color:var(--gold2);font-size:11px;margin-bottom:5px}.stars{color:#e5e9ee;line-height:1.5}
.chat{height:430px;overflow:auto;background:#0c121a;border:1px solid var(--line);border-radius:18px;padding:12px}.msg{max-width:88%;padding:11px 12px;border-radius:15px;margin:8px 0;line-height:1.65;font-size:13px;white-space:pre-wrap}.ai{background:#151d29;border:1px solid #263244}.me{background:#6e5830;margin-left:auto;color:#fff7e7}.chatbar{display:flex;gap:8px;margin-top:9px}.chatbar input{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:12px}.send{background:var(--gold);color:#161108}
.hidden{display:none!important}.note{font-size:10px;color:#697588;line-height:1.6;margin-top:12px}
.poem {
  text-align: center;
  color: #697588;
  font-size: 18px;
  line-height: 1.5;
  margin-top: 20px;
}

/* --- 和谐方舟金字塔排版 CSS --- */
.ark-container { background: var(--panel2); border-radius: 18px; padding: 30px 15px 20px; border: 1px solid var(--line); margin-top: 15px; }
.ark-triangle { position: relative; width: 100%; max-width: 320px; height: 260px; margin: 0 auto 20px; font-weight: bold; font-size: 19px; }
.ark-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
.ark-num { position: absolute; transform: translate(-50%, -50%); color: var(--text); }
.ark-main { color: var(--gold); font-size: 26px; }
.ark-outer { font-size: 17px; }
.ark-base { font-size: 15px; color: var(--text); display: flex; justify-content: center; gap: 20px; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; }

.ark-stats { display: grid; grid-template-columns: repeat(4, 1fr); text-align: center; border-bottom: 1px solid var(--line); padding-bottom: 18px; margin-bottom: 18px; }
.ark-stats b { display: block; font-size: 17px; margin-bottom: 6px; }
.ark-stats span { font-size: 11px; color: var(--muted); }

.ark-joint { display: flex; font-size: 15px; text-align: center; }
.ark-joint-label { width: 70px; color: var(--muted); font-size: 12px; text-align: left; padding-top: 2px; }
.ark-joint-cols { display: flex; flex: 1; justify-content: space-between; }
.ark-joint-cols > div > div { margin-bottom: 10px; }

@media(min-width:650px){.app{padding-left:24px;padding-right:24px}.hero{padding:26px}.card{padding:20px}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand">禅天僧命理 <span>·</span> 信不信由你</div><div class="badge">PRO · 测试版</div></header>
<section class="hero">
<h1>八字 · 紫微</h1>
<div class="sub">输入出生资料，其自动生成四柱、五行结构、十神提示与紫微十二宫盘。点击“此时黄历四柱八字”即会显示此时此刻的四柱八字。</div>
<div class="grid">
<div class="field"><label>出生日期（阳历）</label><input id="date" type="date"></div>
<div class="field"><label>出生时间</label><input id="time" type="time" value="12:00"></div>
<div class="field"><label>性别</label><select id="sex"><option value="m">男</option><option value="f">女</option></select></div>
<div class="field"><label>时区</label><select id="tz"><option value="8">中国/马来西亚/新加坡 · UTC+08:00 </option><option value="9">日本/韩国 · UTC+09:00 </option><option value="7">泰国/越南 · UTC+07:00 </option><option value="0">UTC+00:00</option><option value="-5">UTC-05:00</option><option value="-8">UTC-08:00</option></select></div>
</div>
<div class="grid">
<div class="field"><label>出生地经度（可选，用于真太阳时）</label><input id="lon" type="number" step=".01" placeholder="例如：116.40"></div>
<div class="field"><label>出生地（显示名称）</label><input id="place" placeholder="例如：北京"></div>
</div>
<div class="actions"><button class="primary" onclick="generate()">生成专业命盘</button><button class="secondary" onclick="demo()">八字例子</button></div>
 
<div class="actions" style="margin-top: 10px;">
  <button class="secondary" style="flex: 1; border-color: var(--gold); color: var(--gold);" onclick="todayBazi()">此时黄历四柱八字</button>
</div>
<div class="note">免责声明：命理属于传统文化工具。本禅天僧命理推演器重点提供可离线运行的排盘与结构化解读，不应作为医疗、法律、投资等现实决策的唯一依据。杜绝迷信，相信科学。</div>

  <div class="poem">《无明》<br>
  若以慈悲看众生<br>
  世间皆是可怜人<br>
  若以因果看众生<br>
  世间无一可怜人
</div>
  
</section>

<div id="result" class="hidden">
<div class="tabs"><button class="tab active" onclick="tab('overview',this)">总览</button><button class="tab" onclick="tab('bazi',this)">八字</button><button class="tab" onclick="tab('horoscope',this)">星座</button><button class="tab" onclick="tab('lifenumber',this)">生命数字</button><button class="tab" onclick="tab('ziwei',this)">紫微</button><button class="tab" onclick="tab('chat',this)">命理问答</button></div>
<section id="overview" class="view"></section>
<section id="bazi" class="view hidden"></section>
<section id="horoscope" class="view hidden"></section>
<section id="lifenumber" class="view hidden"></section>
<section id="ziwei" class="view hidden"></section>
<section id="chat" class="view hidden"></section>
</div>
</div>
<script>
const stems=["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"], branches=["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
const wux={甲:"木",乙:"木",丙:"火",丁:"火",戊:"土",己:"土",庚:"金",辛:"金",壬:"水",癸:"水",子:"水",丑:"土",寅:"木",卯:"木",辰:"土",巳:"火",午:"火",未:"土",申:"金",酉:"金",戌:"土",亥:"水"};
const ten=["比肩","劫财","食神","伤官","偏财","正财","七杀","正官","偏印","正印"];
const animals=["鼠","牛","虎","兔","龙","蛇","马","羊","猴","鸡","狗","猪"];
let state=null;
function dtParts(){const d=document.getElementById("date").value,t=document.getElementById("time").value||"12:00";return [d,t]}
function dayIndex(y,m,d){let a=Math.floor((14-m)/12),yy=y+4800-a,mm=m+12*a-3;return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045}
function solarMonth(y,m,d){ 
 const bounds=[5,4,5,5,5,6,7,7,7,8,7,7]; let idx=m-1;
 if(d<bounds[idx]) idx=(idx+11)%12;
 return idx; 
}
function bazi(y,m,d,h,mi){
 let sy=y; if(m<2 || (m===2&&d<4)) sy--;
 let yi=((sy-4)%60+60)%60, ystem=yi%10,ybranch=yi%12;
 let sm=solarMonth(y,m,d); 
 let mb=(sm+1)%12, mstem=((ystem%5)*2+mb)%10;
 let jd=dayIndex(y,m,d), di=((jd+49)%60+60)%60, dstem=di%10,dbranch=di%12;
 let hb=Math.floor((h+1)/2)%12;
 let hstem=(dstem%5*2+hb)%10;
 return {yi,year:[stems[ystem],branches[ybranch]],month:[stems[mstem],branches[mb]],day:[stems[dstem],branches[dbranch]],hour:[stems[hstem],branches[hb]],dstem,dbranch}
}
function countWu(p){
 let c={木:0,火:0,土:0,金:0,水:0};
 p.forEach(x=>{c[wux[x[0]]]++;c[wux[x[1]]]++}); return c
}
function dayMasterInfo(dm){return wux[dm]+" · "+dm+"日主"}
function lunarApprox(y,m,d){ 
 let base=dayIndex(2000,1,7), cur=dayIndex(y,m,d), n=((cur-base)%354+354)%354;
 let lm=Math.floor(n/29.5)+1, ld=Math.floor(n%29.5)+1; if(lm>12)lm=((lm-1)%12)+1; if(ld>30)ld=30;
 return {m:lm,d:ld}
}

function getZodiac(m, d) {
 const zodiacs = [
  {name: "摩羯座", startMonth: 1, startDay: 1, endMonth: 1, endDay: 19},
  {name: "水瓶座", startMonth: 1, startDay: 20, endMonth: 2, endDay: 18},
  {name: "双鱼座", startMonth: 2, startDay: 19, endMonth: 3, endDay: 20},
  {name: "白羊座", startMonth: 3, startDay: 21, endMonth: 4, endDay: 19},
  {name: "金牛座", startMonth: 4, startDay: 20, endMonth: 5, endDay: 20},
  {name: "双子座", startMonth: 5, startDay: 21, endMonth: 6, endDay: 20},
  {name: "巨蟹座", startMonth: 6, startDay: 21, endMonth: 7, endDay: 22},
  {name: "狮子座", startMonth: 7, startDay: 23, endMonth: 8, endDay: 22},
  {name: "处女座", startMonth: 8, startDay: 23, endMonth: 9, endDay: 22},
  {name: "天秤座", startMonth: 9, startDay: 23, endMonth: 10, endDay: 22},
  {name: "天蝎座", startMonth: 10, startDay: 23, endMonth: 11, endDay: 21},
  {name: "射手座", startMonth: 11, startDay: 22, endMonth: 12, endDay: 21},
  {name: "摩羯座", startMonth: 12, startDay: 22, endMonth: 12, endDay: 31}
 ];
 for (let z of zodiacs) {
  if ((m === z.startMonth && d >= z.startDay) || (m === z.endMonth && d <= z.endDay)) {
   return z.name;
  }
 }
 return "未知星座";
}

// 和谐方舟专用单数归约法
function arkRoot(n) {
  if (n === 0) return 0;
  let sum = n;
  while (sum >= 10) {
    sum = sum.toString().split('').reduce((acc, val) => acc + parseInt(val), 0);
  }
  return sum;
}

// 计算生命数字核心函数
function getLifeNumber(y, m, d) {
  let str = `${y}${String(m).padStart(2,'0')}${String(d).padStart(2,'0')}`;
  let sum = str.split('').reduce((acc, val) => acc + parseInt(val), 0);
  return arkRoot(sum);
}

// 和谐方舟完整排盘引擎（基于正确对齐规律重构）
function calcHarmonyArk(y, m, d) {
  let ys = y.toString().padStart(4, '0');
  let ms = m.toString().padStart(2, '0');
  let ds = d.toString().padStart(2, '0');

  let Y1 = parseInt(ys.substring(0, 2)), Y2 = parseInt(ys.substring(2, 4));
  let M = parseInt(ms), D = parseInt(ds);

  let B1 = arkRoot(D), B2 = arkRoot(M), B3 = arkRoot(Y1), B4 = arkRoot(Y2);
  let M1 = arkRoot(B1 + B2), M2 = arkRoot(B3 + B4);
  let G = arkRoot(M1 + M2);

  let L1 = arkRoot(M1 + B1), L2 = arkRoot(M1 + B2);
  let L3 = arkRoot(L1 + L2);
  
  let R1 = arkRoot(M2 + B3), R2 = arkRoot(M2 + B4);
  let R3 = arkRoot(R1 + R2);
  
  // 顶部顶端冠顶数字运算规律调整
  let T1 = arkRoot(G + M1), T2 = arkRoot(G + M2);
  let T3 = arkRoot(T1 + T2);

  let inner = arkRoot(M1 + M2 + G);
  let outer = arkRoot(L3 + R3 + T3);
  let sub = arkRoot(B1 + B4 + M1 + M2); 
  
  // 晚年数字准确组合
  let late = `${R1}${R2}${R3}`; 

  // 根据截图规律完整校准3x4联合数字矩阵
let joint = [
    [`${B1}${B2}${M1}`, `${B3}${B4}${M2}`, `${M1}${M2}${G}`, `${B2}${M1}${L2}`],
    [`${B1}${M1}${L1}`, `${L1}${L2}${L3}`, `${M2}${G}${T2}`, `${M1}${G}${T1}`],
    [`${T2}${T1}${T3}`, `${B3}${M2}${R1}`, `${B4}${M2}${R2}`, `${R1}${R2}${R3}`]
  ];

  return { B1, B2, B3, B4, M1, M2, G, L1, L2, L3, R1, R2, R3, T1, T2, T3, 
           inner, outer, sub, late, joint, ds, ms, y1: ys.substring(0,2), y2: ys.substring(2,4) };
}

function ziwei(y,m,d,h){
 const l=lunarApprox(y,m,d), palaceNames=["命宫","兄弟","夫妻","子女","财帛","疾厄","迁移","交友","官禄","田宅","福德","父母"];
 const life=(l.m+Math.floor((h+1)/2)+10)%12, body=(l.m-Math.floor((h+1)/2)+24)%12;
 let stars=["紫微","天机","太阳","武曲","天同","廉贞","天府","太阴","贪狼","巨门","天相","天梁","七杀","破军"];
 let cells=[];
 for(let i=0;i<12;i++){let p=palaceNames[(i-life+12)%12], a=stars[(i+l.m)%stars.length], b=stars[(i*3+l.d)%stars.length];cells.push({branch:branches[i],p,stars:[a,b]})}
 {l,life,body,cells}
}
 
function tenFor(stem,dm){let a=stems.indexOf(stem),b=stems.indexOf(dm);let diff=(a-b+10)%10;return ten[diff]}
function generate(){
 let [ds,ts]=dtParts(); if(!ds){alert("请选择出生日期");return}
 let [y,m,d]=ds.split("-").map(Number), [hh,mm]=ts.split(":").map(Number);
 let p=bazi(y,m,d,hh,mm), counts=countWu([p.year,p.month,p.day,p.hour]), z=ziwei(y,m,d,hh);
 state={y,m,d,hh,mm,p,counts,z,sex:document.getElementById("sex").value,place:document.getElementById("place").value||"未填写"};
 document.getElementById("result").classList.remove("hidden"); render(); tab("overview",document.querySelector(".tab"));
}

function numToChinese(num) {
  const digits = ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
  return String(num).split('').map(d => digits[parseInt(d)]).join('');
}

function render(){
 const s=state,p=s.p,c=s.counts, total=8, dm=p.day[0], z=s.z;
 let max=Math.max(...Object.values(c)), strongest=Object.keys(c).find(k=>c[k]===max);
 let zodiacName = getZodiac(s.m, s.d);
 let ark = calcHarmonyArk(s.y, s.m, s.d);

 let ln = getLifeNumber(s.y, s.m, s.d);
 const lnDesc = {
   1: "【创始数】代表独立、领导、创新与自信。你是天生的开拓者。",
   2: "【沟通数】代表合作、平衡、倾听与耐心。你擅长协调与建立关系。",
   3: "【表达数】代表创意、表达、欢乐与社交。你具有极强的艺术感染力。",
   4: "【稳定数】代表规律、执行、秩序与务实。你是脚踏实地的建设者。",
   5: "【自由数】代表自由、冒险、多变与好奇。你向往无拘无束的生活。",
   6: "【关怀数】代表责任、家庭、大爱与疗愈。你富有同情心与奉献精神。",
   7: "【真理数】代表探究、直觉、内省与智慧。你是真理的追寻者。",
   8: "【财富数】代表权力、商业、成就与效率。你具备强大的执行力与商业头脑。",
   9: "【智慧数】代表大爱、奉献、灵性与完美。你拥有悲天悯人的情怀."
 };

 let lunarYearStr = numToChinese(s.y) + "年";
 let lunarHourStr = p.hour[1] + "时";
 let lunarMStr = "正月", lunarDStr = "初一";
 
 try {
   const formatter = new Intl.DateTimeFormat('zh-CN-u-ca-chinese', { month: 'long', day: 'numeric' });
   const parts = formatter.formatToParts(new Date(s.y, s.m - 1, s.d));
   parts.forEach(pt => {
     if (pt.type === 'month') lunarMStr = pt.value;
     if (pt.type === 'day') lunarDStr = pt.value;
   });
   if (/^\d+$/.test(lunarDStr)) {
     const dayNames = ["", "初一", "初二", "初三", "初四", "初五", "初六", "初七", "初八", "初九", "初十",
                        "十一", "十二", "十三", "十四", "十五", "十六", "十七", "十八", "十九", "二十",
                        "廿一", "廿二", "廿三", "廿四", "廿五", "廿六", "廿七", "廿八", "廿九", "三十"];
     let dNum = parseInt(lunarDStr, 10);
     lunarDStr = dayNames[dNum] || (dNum + "日");
   }
 } catch (e) {
   lunarMStr = z.l.m + "月";
   lunarDStr = z.l.d + "日";
 }

 let fullLunarText = `${lunarYearStr} ${lunarMStr} ${lunarDStr} ${lunarHourStr}`;

 document.getElementById("overview").innerHTML=`
 <div class="card"><div class="title">命盘摘要</div><div class="bazi">${["年柱","月柱","日柱","时柱"].map((n,i)=>`<div class="pillar"><small>${n}</small><b>${p[["year","month","day","hour"][i]].join("")}</b><em>${i===2?"日主":p[["year","month","day","hour"][i]][1]}</em></div>`).join("")}</div></div>

function advice(dm,c,strong){let t={木:"重视成长、规划与长期积累",火:"行动力与表达是重要资产",土:"稳定、承载与执行是优势",金:"规则、判断与效率值得发挥",水:"信息、流动与洞察力值得发挥"};return `${dm}日主可从「${t[wux[dm]]}」切入。五行显性计数以${strong}较突出，传统命理通常还需结合月令、藏干、刑冲合害及大运流年综合判断，不能只凭一个数量下结论。`}
function ask(){let q=document.getElementById("q"),txt=q.value.trim();if(!txt||!state)return;let box=document.getElementById("messages");box.innerHTML+=`<div class="msg me">${esc(txt)}</div>`;let a=answer(txt);box.innerHTML+=`<div class="msg ai">${a}</div>`;box.scrollTop=box.scrollHeight;q.value=""}
function answer(q){let p=state.p,c=state.counts,dm=p.day[0];if(/事业|工作|职业/.test(q))return `从八字快速结构看，你的日主为${dm}（${wux[dm]}）。目前显性五行以${Object.keys(c).sort((a,b)=>c[b]-c[a])[0]}较突出。职业判断不能只看一个五行，建议再结合月令、官杀,财星、食伤以及大运。若你愿意，我可以继续按‘事业优势 → 风险 → 适合环境 → 行动建议’四步拆解。`;if(/财|钱|收入/.test(q))return `财务主题建议重点观察财星、日主承载力与大运流年，而不是简单地把“某五行多”当成有财或没财。你的日主是${dm}，我可以进一步做财星结构的专项解读。`;if(/感情|恋爱|婚姻|对象/.test(q))return `关系分析在八字里要结合夫妻宫、财官星、合冲刑害和运势阶段；紫微则会重点看夫妻宫及相关会照。你当前盘面已经生成，可以继续问‘我的关系模式有哪些优点和盲点？’。`;return `我会以你的${dm}日主和当前四柱为基础回答。这个试用版适合做结构化命理问答；你可以直接问事业、财运、感情、性格、迁移或某一年份。`;}
function esc(s){return s.replace(/[&<>"]/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[x]))}
function tab(id,el){document.querySelectorAll(".view").forEach(x=>x.classList.add("hidden"));document.getElementById(id).classList.remove("hidden");document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));if(el)el.classList.add("active")}

function todayBazi() {
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, '0');
  const d = String(now.getDate()).padStart(2, '0');
  const h = String(now.getHours()).padStart(2, '0');
  const min = String(now.getMinutes()).padStart(2, '0');

  document.getElementById("date").value = `${y}-${m}-${d}`;
  document.getElementById("time").value = `${h}:${min}`;

  generate();
}
